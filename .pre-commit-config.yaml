#############################################################################################
# pre-commit — language-agnostic hooks for this non-python API repo.                         #
# The only tracked sources are the .proto definition, Markdown docs and the Makefile, so     #
# python-only hooks (mypy/autopep8/flake8/check-ast/name-tests-test/requirements-txt-fixer)  #
# are intentionally NOT included. Generated documentation under docs/ (index.html/index.md,  #
# produced by the "Generate API Documentation" CI) is excluded so no hook rewrites it.       #
#############################################################################################

# Never touch generated docs — docs/ is produced by ondewo-protoc-gen-doc-action in CI.
exclude: '^docs/'

fail_fast: false

repos:

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [ maxkb=1024 ]
      - id: check-json          # validate (does NOT reformat) json/package.json
      - id: check-yaml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/milin/giticket
    rev: '1.92'
    hooks:
      - id: giticket
        args: [ '--regex=(?:(?:feature|bugfix|support|hotfix)/)?(OND[0-9]{3}-[0-9]{1,5})[_-][\w-]+',
                '--format=[{ticket}] {commit_msg}',
                '--mode=regex_match' ]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [ commit-msg ]
